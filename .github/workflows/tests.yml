name: tests

on:
  push:
  pull_request:

jobs:
  # Hosted runners have no CUDA device, so this job validates everything that
  # does not execute a kernel. The CUDA suite runs locally with `uv run pytest`.
  static-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m device_independent
      - run: uv build
