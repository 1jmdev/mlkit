[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlkit"
version = "0.1.0"
description = "Extensible PyTorch quantization with portable storage and optimized inference."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "1jmdev" }]
dependencies = ["torch>=2.8", "safetensors>=0.5"]

[project.optional-dependencies]
transformers = ["transformers>=4.53,<6", "accelerate>=1.8"]
torchao = ["torchao>=0.14,<0.18"]
datasets = ["datasets>=3.6,<6"]
evaluation = ["lm-eval>=0.4.9,<0.6"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11", "mypy>=1.15", "build>=1.2"]

[project.urls]
Repository = "https://github.com/1jmdev/mlkit"

[tool.hatch.build.targets.wheel]
packages = ["src/mlkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "device_independent: runs without a CUDA device",
    "integration: requires downloaded model artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/mlkit"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests"]
